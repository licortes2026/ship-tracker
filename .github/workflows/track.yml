name: Track the World Odyssey

on:
  schedule:
    # Every hour, on the hour, UTC. GitHub runs these best-effort, so expect
    # some runs to be late by a few minutes and the occasional one to be skipped.
    - cron: "0 * * * *"
  workflow_dispatch:          # lets you run it by hand from the Actions tab

# The job commits back to the repo, so it needs write access.
permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Has to comfortably exceed LISTEN_SECONDS below, plus checkout and npm install.
    timeout-minutes: 12

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the websocket client
        run: npm install --no-audit --no-fund ws

      - name: Listen for a position
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          ODYSSEY_MMSI: "311000410"
          # Eight minutes, not 75 seconds. She broadcasts every ~10s underway, but
          # off a coast where aisstream's network is thin only about one in seven of
          # those transmissions arrives — measured at roughly one every 7-8 minutes
          # near Cape Finisterre. A 75s window caught that 2 times in 13; eight
          # minutes should catch it most hours. Actions minutes are unlimited on
          # public repos, so the only cost is the job running longer.
          LISTEN_SECONDS: "480"
        run: node scripts/fetch-position.js

      - name: Commit anything new
        run: |
          git config user.name  "odyssey-tracker"
          git config user.email "odyssey-tracker@users.noreply.github.com"
          git add docs/position.json docs/track.json docs/log.jsonl
          if git diff --staged --quiet; then
            echo "nothing changed this hour"
            exit 0
          fi
          git commit -m "position $(date -u '+%Y-%m-%d %H:%M UTC')"

          # The remote can move between checkout and push: your own commits, a Pages
          # deploy, a previous run finishing late. Re-sync and retry rather than failing.
          for attempt in 1 2 3 4; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, re-syncing (attempt $attempt)"
            # log.jsonl is append-only, so if two runs ever raced, keep both sets of lines.
            if ! git pull --rebase --autostash origin main; then
              echo "rebase hit a conflict, keeping both sides of the log"
              git checkout --theirs docs/log.jsonl 2>/dev/null || true
              git add docs/log.jsonl docs/track.json docs/position.json 2>/dev/null || true
              git rebase --continue || git rebase --abort
            fi
            sleep $((attempt * 5))
          done
          echo "could not push after 4 attempts"
          exit 1
